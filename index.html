<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Downloads</title>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            margin: 0;
            padding: 20px;
            gap: 20px;
        }

        .game-card {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 450px; 
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .game-card:hover {
            border-color: #0072ff;
        }

        .game-title {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px; /* espaço entre os botões */
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            padding: 15px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-size: 14px;
            border: none;
            cursor: pointer;
            flex: 1;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        .btn.secundario {
            background: linear-gradient(135deg, #444 0%, #222 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .info-text {
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Euro Truck -->
    <div class="game-card">
        <div class="game-title">🚚 Euro Truck Simulator 2</div>
        <div class="button-group">
            <a href="https://modsfire.com/vSi1K19h83eIsQI" target="_blank" class="btn">
                📥 DOWNLOAD
            </a>
            <a href="https://youtu.be/01Rh415GOeY" target="_blank" class="btn secundario">
                📺 Tutorial de Instalação
            </a>
        </div>
        <div class="info-text">Versão 1.0 | Servidor Global</div>
    </div>
 <!-- GTA 5 -->
    <div class="game-card">
        <div class="game-title">🚓 GTA 5</div>
        <div class="button-group">
            <a href="https://zpaste.net/p/e0wfs" target="_blank" class="btn">
                📥 DOWNLOAD
            </a>
        </div>
        <div class="info-text">Download direto pelo mediafire dividido em partes</div>
    </div>

</body>
</html>
